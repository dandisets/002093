description: "Abstract\nSocial discrimination in rats relies on vasopressin cells
  (VPCs), neurons intrinsic to the olfactory bulb (OB). Interaction with conspecifics
  in behaving rats increased the induction of the sensitive neural activity marker
  pERK in VPCs (pERK+-VPCs) as well as in neurons of the cholinergic arousal system.
  In acute OB slices, acetylcholine (ACh) switched the generally inhibitory VPC responses
  to olfactory nerve stimulation to excitation and even spiking, thereby possibly
  unlocking the vasopressin system. Thus, can coincident cholinergic neuromodulation
  and afferent input increase pERK induction?   \nHere we investigate ERK activation
  in acute OB slices from transgenic VP-eGFP rats upon various treatments. Both KCl
  and NMDA stimulation result in substantial pERK induction across mitral and granule
  cells and cause VPC spiking, but neither increase pERK+-VPC percentage. ACh alone
  does not change the pERK+ signal in any of these neurons. Conversely, TTX treatment
  prevents basal pERK VPC induction, possibly indicating spontaneous VPC activity,
  which we also observe in whole-cell recordings from a VPC subset. Tetanic olfactory
  nerve stimulation yields regionalized, column-like ERK activation across bulbar
  layers. Within these regions, the presence of ACh during tetanic stimulation substantially
  increases pERK+-VPC numbers, implying that coincident cholinergic neuromodulation
  and afferent synaptic inputs can cooperate to induce pERK in VPCs. \nWhile spiking
  alone is thus insufficient to activate ERK in VPCs, our results validate pERK induction
  as a tool to monitor the cholinergic switch to afferent VPC excitation. Moreover,
  pERK induction in the OB is cell-type specific, implying a corresponding diversity
  in the respective signaling cascades. "
